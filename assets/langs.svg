<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 222" width="460" height="222" role="img" aria-label="Most used languages">
  <title>Most used languages</title>
  <style>
    .card { fill: #0d1117; stroke: #64ffda; stroke-opacity: .22 }
    .ttl { fill: #64ffda } .sub { fill: #54607a }
    .lbl { fill: #ccd6f6 } .pct { fill: #8892b0 } .trk { fill: #1b2635 }
    @media (prefers-color-scheme: light) {
      .card { fill: #ffffff; stroke: #0a7f6b; stroke-opacity: .30 }
      .ttl { fill: #0a7f6b } .sub { fill: #8b949e }
      .lbl { fill: #24292f } .pct { fill: #57606a } .trk { fill: #eaeef2 }
    }
  </style>
  <rect class="card" width="460" height="222" rx="10"/>
  <g font-family='ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace'>
    <text class="ttl" x="22" y="26" font-size="13" letter-spacing=".4">Most used languages</text>
    <text class="sub" x="22" y="41" font-size="9.5">by bytes, across my 15 largest repos</text>
    <g>
      <text class="lbl" x="22" y="67" font-size="11.5">TypeScript</text>
      <rect class="trk" x="118" y="58" width="266" height="9" rx="4.5"/>
      <rect x="118" y="58" width="166.7" height="9" rx="4.5" fill="#3178c6"/>
      <text class="pct" x="438" y="67" font-size="11.5" text-anchor="end">62.7%</text>
    </g>
    <g>
      <text class="lbl" x="22" y="97" font-size="11.5">Python</text>
      <rect class="trk" x="118" y="88" width="266" height="9" rx="4.5"/>
      <rect x="118" y="88" width="44.2" height="9" rx="4.5" fill="#3572A5"/>
      <text class="pct" x="438" y="97" font-size="11.5" text-anchor="end">16.6%</text>
    </g>
    <g>
      <text class="lbl" x="22" y="127" font-size="11.5">JavaScript</text>
      <rect class="trk" x="118" y="118" width="266" height="9" rx="4.5"/>
      <rect x="118" y="118" width="32.3" height="9" rx="4.5" fill="#f1e05a"/>
      <text class="pct" x="438" y="127" font-size="11.5" text-anchor="end">12.2%</text>
    </g>
    <g>
      <text class="lbl" x="22" y="157" font-size="11.5">C++</text>
      <rect class="trk" x="118" y="148" width="266" height="9" rx="4.5"/>
      <rect x="118" y="148" width="10.0" height="9" rx="4.5" fill="#f34b7d"/>
      <text class="pct" x="438" y="157" font-size="11.5" text-anchor="end">3.8%</text>
    </g>
    <g>
      <text class="lbl" x="22" y="187" font-size="11.5">Go</text>
      <rect class="trk" x="118" y="178" width="266" height="9" rx="4.5"/>
      <rect x="118" y="178" width="8.6" height="9" rx="4.5" fill="#00ADD8"/>
      <text class="pct" x="438" y="187" font-size="11.5" text-anchor="end">3.2%</text>
    </g>
  </g>
</svg>
