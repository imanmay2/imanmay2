      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="win"><rect width="332" height="368" rx="10"/></clipPath>
    <clipPath id="screen"><rect y="34" width="332" height="334"/></clipPath>
  </defs>

